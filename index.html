<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tế bào nhân thực thực vật 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#eaf4f1;--bg2:#b3d3d2;--panel:#ffffff;--fg:#0a2420;--mut:#33524d;--line:#4f8a80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12303a;--bg2:#050b14;--panel:#0c1b28;--fg:#f4fbf9;--mut:#b9d3ce;--line:#5f8f9a}}
:root[data-theme="dark"]{--bg1:#12303a;--bg2:#050b14;--panel:#0c1b28;--fg:#f4fbf9;--mut:#b9d3ce;--line:#5f8f9a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(circle at 50% 38%,var(--bg1),var(--bg2));color:var(--fg)}
.panel{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
#row::-webkit-scrollbar{display:none}
#info .bd{display:none}
#info.open .bd{display:block}
#info .ch::before{content:"▲"}
#info.open .ch::before{content:"▼"}
@media(min-width:768px){#info .bd{display:block}#info .ch{display:none}}
/* Màn hình chờ (CSS thuần, hiện ngay cả khi thư viện 3D chưa tải xong) */
#ld{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1.5rem;text-align:center;background:radial-gradient(circle at 50% 38%,var(--bg1),var(--bg2));color:var(--fg);transition:opacity .7s ease,visibility .7s}
#ld.done{opacity:0;visibility:hidden;pointer-events:none}
.ld-cell{position:relative;box-sizing:border-box;width:148px;height:104px;overflow:hidden;border:6px solid #1f7a2e;border-radius:28px;background:rgba(42,159,201,.3);box-shadow:inset 0 0 0 3px #eab308,0 8px 24px rgba(0,0,0,.28);animation:ld-breathe 2.4s ease-in-out infinite}
.ld-vac{position:absolute;left:50%;top:50%;width:104px;height:62px;margin:-31px 0 0 -52px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#6f97f5,#2f5bd1 70%);opacity:.92;animation:ld-vac 2.4s ease-in-out infinite}
.ld-nuc{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbbf24,#f59e0b 70%);box-shadow:0 0 0 3px rgba(245,158,11,.35);animation:ld-pulse 1.6s ease-in-out infinite}
.ld-nuc::after{content:"";position:absolute;left:12px;top:10px;width:12px;height:12px;border-radius:50%;background:#d0211b}
.ld-orbit{position:absolute;inset:0;animation:ld-spin 3.6s linear infinite}
.ld-orbit b{position:absolute;left:50%;top:50%;width:18px;height:10px;margin:-5px 0 0 -9px;border-radius:50%;background:#22a846;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);transform:rotate(var(--a)) translateX(38px)}
.ld-orbit b.m{width:16px;height:8px;margin:-4px 0 0 -8px;background:#f0443c}
.ld-t{margin:0;font-size:.95rem;font-weight:600;letter-spacing:.02em}
.ld-d i{display:inline-block;width:.3em;height:.3em;margin-left:.25em;border-radius:50%;background:currentColor;animation:ld-blink 1.2s infinite both}
.ld-d i:nth-child(2){animation-delay:.2s}
.ld-d i:nth-child(3){animation-delay:.4s}
.ld-bar{width:140px;height:4px;overflow:hidden;border-radius:99px;background:rgba(127,127,127,.28)}
.ld-bar i{display:block;width:40%;height:100%;border-radius:inherit;background:#1fb36b;animation:ld-slide 1.3s ease-in-out infinite}
#ld.err .ld-d,#ld.err .ld-bar{display:none}
#ld.err .ld-orbit,#ld.err .ld-cell,#ld.err .ld-vac,#ld.err .ld-nuc{animation-play-state:paused}
@keyframes ld-spin{to{transform:rotate(360deg)}}
@keyframes ld-pulse{50%{transform:scale(1.14)}}
@keyframes ld-vac{50%{transform:scale(1.08,1.12)}}
@keyframes ld-breathe{50%{transform:scale(1.04)}}
@keyframes ld-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes ld-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.ld-orbit{animation-duration:12s}.ld-cell,.ld-vac,.ld-nuc{animation:none}}
/* ===== Nâng cấp giao diện ===== */
.panel{background:color-mix(in srgb,var(--panel) 68%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);box-shadow:0 10px 32px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .3s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s}
button.panel{cursor:pointer}
button.panel:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 34px rgba(0,0,0,.3),0 0 22px color-mix(in srgb,var(--line) 70%,transparent)}
button.panel:active{transform:scale(.94)}
button.panel:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#info>*{animation:inf .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes inf{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
#hd h1{letter-spacing:-.01em;text-shadow:0 2px 18px color-mix(in srgb,var(--bg2) 85%,transparent)}
@media (prefers-reduced-motion:reduce){button.panel:hover{transform:none}#info>*{animation:none}}
</style>
</head>

    </div>
  </div>
  <p class="ld-t"><span class="ld-msg">Mô hình được dựng bởi nhóm 2</span><span class="ld-d"><i></i><i></i><i></i></span></p>
  <div class="ld-bar"><i></i></div>
</div>

addEventListener('error',function(){var l=document.getElementById('ld');if(l&&!window.__ready){l.classList.add('err');l.querySelector('.ld-msg').textContent='Không tải được mô hình 3D. Kiểm tra mạng rồi tải lại trang.'}});
</script>

    <div>
      <h1 class="text-base md:text-xl font-bold leading-tight">Tế bào nhân thực thực vật</h1>
      <p class="text-xs" style="color:var(--mut)">Kéo để xoay · chụm để phóng to · chạm vào bào quan</p>

    <div class="flex shrink-0 gap-2 self-start pointer-events-auto text-xs">

      <button id="rs" class="panel rounded-full px-3 py-1.5">Đặt lại</button>

  <div id="row" class="pointer-events-auto absolute left-3 right-3 bottom-3 flex gap-2 overflow-x-auto md:right-auto md:w-48 md:top-24 md:bottom-auto md:flex-col md:overflow-visible"></div>

 const im=new T.InstancedMesh(new T.SphereGeometry(.045,6,5),M('er',0xffd21f),rib.length),d=new T.Object3D();
 rib.forEach((v,i)=>{d.position.copy(v);d.updateMatrix();im.setMatrixAt(i,d.matrix)});er.add(im);
 for(let j=0;j<6;j++){const q=new T.Vector3(R()-.5,R()-.5,R()-.5).normalize().multiplyScalar(1.5),pts=[];
  for(let i=0;i<9;i++){pts.push(q.clone());q.add(new T.Vector3(R()-.5,R()-.5,R()-.5).multiplyScalar(.9));q.x=Math.max(-1.7,Math.min(1.1,q.x));q.y=Math.max(-.3,Math.min(.8,q.y));q.z=cl(q.z,3.5)}
  mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),60,.042,5),M('er',0xf5b800),'er',er)}}

// Golgi
const GP=new T.Vector3(-2.6,.45,4),go_=reg('golgi',new T.Group());go_.position.copy(GP);go_.rotation.y=.4;go_.scale.setScalar(1.3);cell.add(go_);
for(let i=0;i<6;i++){const m=mesh(new T.SphereGeometry(1,28,10,0,6.2832,0,.95),M('golgi',new T.Color().setHSL(.93+i*.015,.78,.5)),'golgi',go_);m.scale.set(.72-i*.02,.45,.72-i*.02);m.position.y=i*.14-.35}
for(let i=0;i<12;i++){const a=R()*6.28,r=.75+R()*.25,v=mesh(new T.SphereGeometry(.07+R()*.05,10,8),M('golgi',0xffb703),'golgi',go_);v.position.set(Math.cos(a)*r,R()*.8-.4,Math.sin(a)*r);movers.push({o:v,y:v.position.y,ph:R()*6,s:3})}
placed.push({p:GP,r:1.8});

// Lục lạp & ti thể (dùng chung geometry)
const U=T.BufferGeometryUtils,gr=[],cr=[];
for(const x of[-.34,-.11,.12,.35])for(const z of[-.1,.1])for(let i=0;i<5;i++)gr.push(new T.CylinderGeometry(.09,.09,.032,10).translate(x,(i-2)*.052,z));
for(let i=0;i<6;i++)cr.push(new T.CylinderGeometry(.19,.19,.025,12).rotateZ(Math.PI/2).translate(-.46+i*.18,(i%2?.07:-.07),0));
const gG=U.mergeBufferGeometries(gr),cG=U.mergeBufferGeometries(cr),shC=new T.SphereGeometry(.5,24,16,0,6.2832,1.1,Math.PI-1.1),shM=new T.SphereGeometry(.5,24,16,0,6.2832,1,Math.PI-1);
function spot(){for(let n=0;n<120;n++){const p=new T.Vector3((R()*2-1)*6.4,.12,R()*9-4);
 
 if((((p.x-1.5)/5.5)**2+((p.z-.5)/4.5)**2>1&&placed.every(q=>q.p.distanceTo(p)>q.r*.5+1.1))||n==119){placed.push({p,r:.4});return p}}}
for(let i=0;i<14;i++){const g=reg('chloro',new T.Group());g.position.copy(spot());g.rotation.y=R()*6;g.scale.setScalar(1.4);cell.add(g);
 mesh(shC,M('chloro',0x22a846),'chloro',g).scale.set(1.1,.62,.78);mesh(gG,M('chloro',0x0f6a2c),'chloro',g);movers.push({o:g,y:g.position.y,ph:R()*6,s:.06})}
for(let i=0;i<8;i++){const g=reg('mito',new T.Group());g.position.copy(spot());g.rotation.y=R()*6;g.scale.setScalar(1.3);cell.add(g);
 mesh(shM,M('mito',0xf0443c),'mito',g).scale.set(1.3,.55,.55);mesh(cG,M('mito',0x9b1233),'mito',g);movers.push({o:g,y:g.position.y,ph:R()*6,s:.06})}

// Tế bào chất: hạt chảy dọc rìa tế bào
const N=650,B=[],pos=new Float32Array(N*3);
while(B.length<N){const x=(R()*2-1)*7,z=R()*9.4-4.2;if(((x-1.5)/5.2)**2+((z-.5)/4.2)**2>1)B.push([x,.18+R()*.55,z,z>.5?1:-1,R()*6])}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pos,3).setUsage(T.DynamicDrawUsage));
const pm=new T.PointsMaterial({size:.24,map:GL,color:0xffffff,transparent:true,opacity:.8,depthWrite:false,blending:T.AdditiveBlending,toneMapped:false});pm.userData.c=new T.Color(0xffffff);(mats.cyto=mats.cyto||[]).push(pm);
const pts=reg('cyto',new T.Points(pg,pm));pts.frustumCulled=false;pts.userData.k='cyto';picks.push(pts);cell.add(pts);
pg.boundingSphere=new T.Sphere(new T.Vector3(),12);

// ===== Hiệu ứng nâng cao =====
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const DN=240,dp=new Float32Array(DN*3),dsp=[];
for(let i=0;i<DN;i++){dp.set([(R()-.5)*36,R()*15-3.5,(R()-.5)*32],i*3);dsp.push(.12+R()*.35)}
const dg=new T.BufferGeometry();dg.setAttribute('position',new T.BufferAttribute(dp,3));
const dust=new T.Points(dg,new T.PointsMaterial({size:.2,map:GL,color:0x8fe3ff,transparent:true,opacity:.55,depthWrite:false,blending:T.AdditiveBlending,toneMapped:false}));dust.frustumCulled=false;sc.add(dust);
// Tia năng lượng: xanh từ lục lạp (quang hợp), cam từ ti thể (ATP)
const SN=120,sq=new Float32Array(SN*3),sk=new Float32Array(SN*3),SP=[];
for(let i=0;i<SN;i++){const ch=i<72,a=groups[ch?'chloro':'mito'];SP.push({g:a[i%a.length],f:R(),v:.18+R()*.25,x:(R()-.5)*.9,z:(R()-.5)*.6,c:ch?[.75,1,.3]:[1,.6,.18]})}
const sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(sq,3));sg.setAttribute('color',new T.BufferAttribute(sk,3));
const spk=new T.Points(sg,new T.PointsMaterial({size:.26,map:GL,vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending,toneMapped:false}));spk.frustumCulled=false;sc.add(spk);
// Vòng xung lan ra khi chọn bào quan
const ring={t:9,c:new T.Vector3(),s:1,m:new T.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false,depthTest:false,blending:T.AdditiveBlending,side:T.DoubleSide,toneMapped:false})};
ring.o=new T.Mesh(new T.RingGeometry(.92,1,64),ring.m);ring.o.renderOrder=9;ring.o.visible=false;sc.add(ring.o);
function fxRing(c,s,k){ring.t=0;ring.c.copy(c);ring.s=Math.min(Math.max(s,.8),5);ring.m.color.set(DATA.find(x=>x.k==k).c);ring.o.visible=true}
// Hậu kỳ (nếu không hỗ trợ sẽ tự quay về kết xuất thường)
let cp=null,fin=null;
try{const rt=rd.capabilities.isWebGL2?new T.WebGLMultisampleRenderTarget(innerWidth,innerHeight):void 0;if(rt)rt.samples=innerWidth<768?2:4;
 cp=new T.EffectComposer(rd,rt);cp.addPass(new T.RenderPass(sc,cam));
 cp.addPass(new T.UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),.6,.7,.6));
 fin=new T.ShaderPass({uniforms:{tDiffuse:{value:null},uT:{value:0},uAsp:{value:1},uA:{value:new T.Color()},uB:{value:new T.Color()}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tDiffuse;uniform float uT,uAsp;uniform vec3 uA,uB;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 q=vUv-.5;float r=length(q)*1.414;vec4 s=texture2D(tDiffuse,vUv);vec2 o=q*r*.012;
 s.r=texture2D(tDiffuse,vUv+o).r;s.b=texture2D(tDiffuse,vUv-o).b;
 vec2 w=(vUv-vec2(.5,.38))*vec2(uAsp,1.);
 vec3 bg=mix(uA,uB,clamp(length(w)/length(vec2(.5*uAsp,.62)),0.,1.));
 vec3 c=s.rgb+bg*(1.-clamp(s.a,0.,1.));
 c*=1.-.34*smoothstep(.55,1.05,r);c+=(h(vUv*900.+uT)-.5)*.02;c=max(c,0.);
 c=mix(c*12.92,1.055*pow(c,vec3(.4166667))-.055,step(.0031308,c));gl_FragColor=vec4(c,1.);}`});
 cp.addPass(fin);
 const th=()=>{const g=getComputedStyle(document.documentElement);fin.uniforms.uA.value.set(g.getPropertyValue('--bg1').trim()).convertSRGBToLinear();fin.uniforms.uB.value.set(g.getPropertyValue('--bg2').trim()).convertSRGBToLinear()};
 th();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',th);new MutationObserver(th).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})
}catch(e){cp=null;fin=null}
function fxu(t,dt){if(RM)dt*=.2;
 for(let i=0;i<DN;i++){let y=dp[3*i+1]+dsp[i]*dt;if(y>11.5)y=-3.5;dp[3*i+1]=y;dp[3*i]+=Math.sin(t*.4+i)*dt*.25}
 dg.attributes.position.needsUpdate=true;
 for(let i=0;i<SN;i++){const e=SP[i],g=e.g.position,l=(e.f+t*e.v)%1,a=Math.sin(Math.PI*l)*(!sel||sel==e.g.userData.k?1:.1);
  sq[3*i]=g.x+e.x*(.4+l);sq[3*i+1]=g.y+.3+l*1.6;sq[3*i+2]=g.z+e.z*(.4+l);sk[3*i]=e.c[0]*a;sk[3*i+1]=e.c[1]*a;sk[3*i+2]=e.c[2]*a}
 sg.attributes.position.needsUpdate=sg.attributes.color.needsUpdate=true;
 if(ring.t<1){ring.t+=dt/1.1;const e=1-Math.pow(1-ring.t,3);ring.o.position.copy(ring.c);ring.o.quaternion.copy(cam.quaternion);ring.o.scale.setScalar(ring.s*(.35+1.05*e));ring.m.opacity=.85*(1-ring.t);if(ring.t>=1)ring.o.visible=false}
 if(fin)fin.uniforms.uT.value=t}

// Tương tác
let sel=null,tw=null;const hot=k=>sel==k||(sel=='nucleus'&&k=='nucleolus');
const rc=new T.Raycaster(),ms=new T.Vector2(),BIG=['wall','membrane','vacuole','cyto'];rc.params.Points.threshold=.12;
const vis=o=>{while(o){if(!o.visible)return false;o=o.parent}return true};
const root=(o,k)=>{while(o&&!groups[k].includes(o))o=o.parent;return o};
function pick(e){const r=cv.getBoundingClientRect();ms.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(ms,cam);
 const h=rc.intersectObjects(picks,false).filter(x=>vis(x.object));return h.find(x=>!BIG.includes(x.object.userData.k))||h[0]}
const row=$('#row');
DATA.forEach(d=>{const b=document.createElement('button');b.dataset.k=d.k;b.className='panel shrink-0 flex items-center gap-1.5 rounded-full md:rounded-xl px-3 py-1.5 text-xs text-left';b.innerHTML=`<i class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${d.c}"></i>${d.n}`;b.onclick=()=>go(d.k);row.appendChild(b)});
function ui(k){const d=DATA.find(x=>x.k==k)||INTRO;
 $('#info').innerHTML=`<button class="tg flex w-full items-center gap-2 text-left" aria-expanded="${$('#info').classList.contains('open')}"><i class="w-3 h-3 rounded-full shrink-0" style="background:${d.c}"></i><div class="min-w-0 flex-1 flex items-baseline gap-2 md:block"><h2 class="font-semibold text-sm md:text-base whitespace-nowrap">${d.n}</h2><p class="text-xs truncate" style="color:var(--mut)">${d.en}</p></div><span class="ch text-xs"></span></button><div class="bd mt-1.5 md:mt-2 text-xs md:text-sm leading-snug"><p><b>Cấu tạo:</b> ${d.s}</p><p class="mt-1"><b>Chức năng:</b> ${d.f}</p></div>`;
 row.querySelectorAll('button').forEach(b=>{const on=b.dataset.k==k,c=on&&DATA.find(x=>x.k==k).c;b.style.outline=on?'2px solid '+c:'none';b.style.boxShadow=on?'0 0 22px '+c+'b0':''})}
function go(k,obj){sel=k;ui(k);ct.autoRotate=false;let p=home.p,t=home.t;
 if(k&&!['wall','membrane','cyto'].includes(k)){obj=obj||groups[k].reduce((a,b)=>a.getWorldPosition(new T.Vector3()).distanceTo(cam.position)<b.getWorldPosition(new T.Vector3()).distanceTo(cam.position)?a:b);
  const bx=new T.Box3().setFromObject(obj),c=bx.getCenter(new T.Vector3()),s=bx.getSize(new T.Vector3()).length();
  const dir=k=='nucleolus'?new T.Vector3(0,1.8,.5):new T.Vector3(0,1.1,.9);
  fxRing(c,s,k);t=c;p=c.clone().add(dir.normalize().multiplyScalar(k=='vacuole'?15:s*1.5+1.4))}
 tw={t:0,p0:cam.position.clone(),t0:ct.target.clone(),p1:p.clone(),t1:t.clone()}}
let dn;cv.addEventListener('pointerdown',e=>dn={x:e.clientX,y:e.clientY,t:performance.now()});
cv.addEventListener('pointerup',e=>{if(dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<6&&performance.now()-dn.t<500){const h=pick(e);h?go(h.object.userData.k,root(h.object,h.object.userData.k)):go(null)}dn=null});
cv.addEventListener('pointermove',e=>{if(e.pointerType=='mouse')cv.style.cursor=pick(e)?'pointer':'grab'});
ct.addEventListener('start',()=>{tw=null});
$('#rs').onclick=()=>go(null);
$('#rot').onclick=()=>{ct.autoRotate=!ct.autoRotate};
$('#wl').onclick=e=>{const v=!wall.visible;wall.visible=mem.visible=v;e.target.textContent=v?'Ẩn vách':'Hiện vách'};
function shift(){const w=innerWidth,h=innerHeight,t=$('#info').getBoundingClientRect().top,hb=$('#hd').getBoundingClientRect().bottom,dy=w<768?Math.max(0,Math.min((h-hb-t)/2,h*.25)):0;
 dy?cam.setViewOffset(w,h,0,dy,w,h):cam.clearViewOffset();cam.updateProjectionMatrix()}
{const ro=new ResizeObserver(shift);ro.observe($('#info'));ro.observe($('#hd'))}
$('#info').onclick=e=>{const b=e.target.closest('.tg');if(b)b.setAttribute('aria-expanded',$('#info').classList.toggle('open'))};
function fit(){const w=innerWidth,h=innerHeight,a=w/h,d=Math.max(16,17/(.828*a));rd.setSize(w,h);cp&&(cp.setPixelRatio(rd.getPixelRatio()),cp.setSize(w,h),fin.uniforms.uAsp.value=a);cam.aspect=a;shift();
 const first=!home.p.length();home.p.set(0,d*.62,d*.82);home.t.set(0,-.6,.4);if(first){cam.position.copy(home.p);ct.target.copy(home.t)}}
addEventListener('resize',fit);fit();ui(null);ct.autoRotate=true;

const clk=new T.Clock(),ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
 if(tw){tw.t+=dt/1.3;const k=ease(Math.min(tw.t,1));cam.position.lerpVectors(tw.p0,tw.p1,k);ct.target.lerpVectors(tw.t0,tw.t1,k);if(tw.t>=1)tw=null}
 for(const k in mats)for(const m of mats[k]){_c.copy(m.userData.c);if(sel&&!hot(k))_c.lerp(DIMC,FOCUS);m.color.lerp(_c,.1);if(m.emissive){m.emissive.copy(m.color);m.emissiveIntensity+=((hot(k)?.5+.2*Math.sin(t*4.5):.12)-m.emissiveIntensity)*.1}}
 for(const m of movers){m.o.position.y=m.y+Math.sin(t*.9+m.ph)*m.s;if(m.s<1)m.o.rotation.y+=dt*.12}
 for(let i=0;i<N;i++){const b=B[i];let x=b[0]+b[3]*t*.45;x=((x+7)%14+14)%14-7;pos[3*i]=x;pos[3*i+1]=b[1]+Math.sin(t+b[4])*.12;pos[3*i+2]=b[2]+Math.cos(t*.8+b[4])*.12}
 pg.attributes.position.needsUpdate=true;
 ct.update();fxu(t,dt);cp?cp.render(dt):rd.render(sc,cam)})();

// Hiệu ứng tải: ẩn màn hình chờ sau khung hình đầu tiên (hiện tối thiểu 1,2 giây cho khỏi chớp),
// rồi camera bay vào từ xa. Muốn bỏ hiệu ứng bay vào: xóa khối "if(!matchMedia...)" bên dưới.
window.__ready=true;
requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>{
 const l=$('#ld');l.classList.add('done');l.setAttribute('aria-hidden','true');setTimeout(()=>l.remove(),800);
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
  const dir=home.p.clone().sub(home.t),far=home.t.clone().add(dir.clone().setLength(Math.min(dir.length()*1.9,64)));
  cam.position.copy(far);tw={t:0,p0:far,t0:home.t.clone(),p1:home.p.clone(),t1:home.t.clone()}}
},Math.max(0,1200-performance.now()))));
</script>
</body>
